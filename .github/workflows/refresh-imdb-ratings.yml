name: Refresh official IMDb ratings

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-imdb-ratings
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/update-imdb-ratings.mjs
      - name: Commit updated ratings
        run: |
          if git diff --quiet -- data/imdb-ratings.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/imdb-ratings.json
          git commit -m "Refresh official IMDb ratings"
          git push

